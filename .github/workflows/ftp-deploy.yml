name: 🚀 Full Deploy (Site + VPS Server)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Install & Build Frontend
      run: |
        npm install
        npm run build

    # ШАГ 1: Отправляем ФРОНТЕНД (готовый сайт) на хостинг
    - name: 📂 Deploy Frontend to Beget
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ./public_html/
        # Удали старые файлы, чтобы сайт был чистым
        dangerous-clean-slate: true 

    # ШАГ 2: Отправляем БЭКЕНД (исходники сервера) на VPS
    - name: 📂 Deploy Backend to VPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /var/www/lgzt-back/
        # Не копируем лишнее на сервер
        exclude: |
          node_modules/**
          dist/**
          src/**
          .git/**
          .github/**
