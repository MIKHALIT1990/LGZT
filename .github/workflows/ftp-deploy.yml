name: 🚀 DOUBLE DEPLOY (SITE & SERVER)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v4

      - name: 🛠️ Build Frontend
        run: |
          npm install
          npm run build

      - name: 🌐 Upload Site to BEGET (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./lgzt-trade.ru/public_html/
          dangerous-clean-slate: true
          port: 21
          protocol: ftp

      - name: ⚙️ Upload Server to VPS (SFTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.VPS_SERVER }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          local-dir: ./
          server-dir: /var/www/lgzt-back/
          port: 22
          protocol: sftp
          dangerous-clean-slate: false
          exclude: |
            node_modules/**
            dist/**
            src/**
            .git/**
            .github/**
            .env
            data.json
